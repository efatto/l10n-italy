name: tests

on:
  pull_request:
    branches:
      - "16.0*"
  push:
    branches:
      - "16.0"
      - "16.0-ocabot-*"

jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@v4
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.10-odoo16.0:latest
            include: "openupgrader,python_venv,account_vat_period_end_statement,currency_rate_update_boi,fiscal_epos_print,l10n_it_abicab,l10n_it_accompanying_invoice,l10n_it_account,l10n_it_account_stamp,l10n_it_account_tax_kind,l10n_it_amount_to_text,l10n_it_appointment_code,l10n_it_asset_management,l10n_it_ateco,l10n_it_bill_of_entry,l10n_it_central_journal_reportlab,l10n_it_declaration_of_intent,l10n_it_delivery_note,l10n_it_delivery_note_base,l10n_it_delivery_note_batch,l10n_it_delivery_note_order_link,l10n_it_fatturapa,l10n_it_fatturapa_auto_sale_order,l10n_it_fatturapa_export_zip,l10n_it_fatturapa_govway,l10n_it_fatturapa_import_zip,l10n_it_fatturapa_import_zip_in_rc,l10n_it_fatturapa_in,l10n_it_fatturapa_in_purchase,l10n_it_fatturapa_in_rc,l10n_it_fatturapa_out,l10n_it_fatturapa_out_di,l10n_it_fatturapa_out_oss,l10n_it_fatturapa_out_rc,l10n_it_fatturapa_out_sp,l10n_it_fatturapa_out_stamp,l10n_it_fatturapa_out_triple_discount,l10n_it_fatturapa_out_wt,l10n_it_fatturapa_pec,l10n_it_fatturapa_sale,l10n_it_fatturapa_sdicoop,l10n_it_financial_statement_eu,l10n_it_financial_statements_report,l10n_it_fiscal_document_type,l10n_it_fiscal_payment_term,l10n_it_fiscalcode,l10n_it_fiscalcode_sale,l10n_it_intrastat,l10n_it_intrastat_statement,l10n_it_ipa,l10n_it_location_nuts,l10n_it_payment_reason,l10n_it_pec,l10n_it_pos_fiscalcode,l10n_it_rea,l10n_it_reverse_charge,l10n_it_reverse_charge_start_end_dates,l10n_it_riba,l10n_it_sct_cbi,l10n_it_sdi_channel,l10n_it_split_payment,l10n_it_vat_payability,l10n_it_vat_registries,l10n_it_vat_registries_rc,l10n_it_vat_registries_split_payment,l10n_it_vat_settlement_date,l10n_it_vat_settlement_date_rc,l10n_it_vat_statement_communication,l10n_it_vat_statement_split_payment,l10n_it_website_portal_fatturapa,l10n_it_website_portal_fiscalcode,l10n_it_website_portal_ipa,l10n_it_website_sale_fiscalcode,l10n_it_withholding_tax,l10n_it_withholding_tax_financial_report,l10n_it_withholding_tax_payment,l10n_it_withholding_tax_payment_order,l10n_it_withholding_tax_reason"
            name: test with Odoo
          - container: ghcr.io/oca/oca-ci/py3.10-ocb16.0:latest
            include: "openupgrader,python_venv,account_vat_period_end_statement,currency_rate_update_boi,fiscal_epos_print,l10n_it_abicab,l10n_it_accompanying_invoice,l10n_it_account,l10n_it_account_stamp,l10n_it_account_tax_kind,l10n_it_amount_to_text,l10n_it_appointment_code,l10n_it_asset_management,l10n_it_ateco,l10n_it_bill_of_entry,l10n_it_central_journal_reportlab,l10n_it_declaration_of_intent,l10n_it_delivery_note,l10n_it_delivery_note_base,l10n_it_delivery_note_batch,l10n_it_delivery_note_order_link,l10n_it_fatturapa,l10n_it_fatturapa_auto_sale_order,l10n_it_fatturapa_export_zip,l10n_it_fatturapa_govway,l10n_it_fatturapa_import_zip,l10n_it_fatturapa_import_zip_in_rc,l10n_it_fatturapa_in,l10n_it_fatturapa_in_purchase,l10n_it_fatturapa_in_rc,l10n_it_fatturapa_out,l10n_it_fatturapa_out_di,l10n_it_fatturapa_out_oss,l10n_it_fatturapa_out_rc,l10n_it_fatturapa_out_sp,l10n_it_fatturapa_out_stamp,l10n_it_fatturapa_out_triple_discount,l10n_it_fatturapa_out_wt,l10n_it_fatturapa_pec,l10n_it_fatturapa_sale,l10n_it_fatturapa_sdicoop,l10n_it_financial_statement_eu,l10n_it_financial_statements_report,l10n_it_fiscal_document_type,l10n_it_fiscal_payment_term,l10n_it_fiscalcode,l10n_it_fiscalcode_sale,l10n_it_intrastat,l10n_it_intrastat_statement,l10n_it_ipa,l10n_it_location_nuts,l10n_it_payment_reason,l10n_it_pec,l10n_it_pos_fiscalcode,l10n_it_rea,l10n_it_reverse_charge,l10n_it_reverse_charge_start_end_dates,l10n_it_riba,l10n_it_sct_cbi,l10n_it_sdi_channel,l10n_it_split_payment,l10n_it_vat_payability,l10n_it_vat_registries,l10n_it_vat_registries_rc,l10n_it_vat_registries_split_payment,l10n_it_vat_settlement_date,l10n_it_vat_settlement_date_rc,l10n_it_vat_statement_communication,l10n_it_vat_statement_split_payment,l10n_it_website_portal_fatturapa,l10n_it_website_portal_fiscalcode,l10n_it_website_portal_ipa,l10n_it_website_sale_fiscalcode,l10n_it_withholding_tax,l10n_it_withholding_tax_financial_report,l10n_it_withholding_tax_payment,l10n_it_withholding_tax_payment_order,l10n_it_withholding_tax_reason"
            name: test with OCB
            makepot: "true"
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install python_venv
        run: pip3 install -e "git+https://github.com/efatto/openupgrader@16.0#egg=odoo-addon-python_venv&subdirectory=setup/python_venv"
      - name: Install openupgrader
        run: pip3 install -e "git+https://github.com/efatto/openupgrader@16.0#egg=odoo-addon-openupgrader&subdirectory=setup/openupgrader"
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Check licenses
        run: echo Skipping manifestoo -d . check-licenses
      - name: Check development status
        run: echo Skipping manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Initialize test db
        run: oca_init_test_database
      - name: Run tests
        run: oca_run_tests
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Update .pot files
        run: oca_export_and_push_pot https://x-access-token:${{ secrets.GIT_PUSH_TOKEN }}@github.com/${{ github.repository }}
        if: ${{ matrix.makepot == 'true' && github.event_name == 'push' && github.repository_owner == 'OCA' }}
